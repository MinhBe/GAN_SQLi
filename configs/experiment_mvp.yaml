experiment:
  name: mvp_seqgan_utility_v0
  seed: 42
  task: defensive_lab_research_only

data:
  text_col: payload
  label_col: label
  source_col: source
  family_col: attack_family
  lineage_col: lineage_id
  test_size: 0.20
  val_size: 0.10

detector:
  ngram_range: [3, 5]
  max_features: 50000
  class_weight: balanced
  max_iter: 1000

seqgan:
  max_len: 160
  embedding_dim: 64
  hidden_dim: 128
  batch_size: 64
  mle_epochs: 1
  adv_epochs: 1
  generate_n: 200
  temperature: 1.0

quality_gate:
  min_len: 2
  max_len: 256

selection:
  budget_per_selector: 100
