[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sqlgan-dual-cgr"
version = "0.2.0"
description = "Canonical Grammar-Rewarded SeqGAN toolkit for PostgreSQL Boolean SQLi research corpora"
requires-python = ">=3.10"
dependencies = [
  "torch>=2.0",
  "pandas>=2.0",
  "numpy>=1.24",
  "tqdm>=4.66",
  "PyYAML>=6.0",
]

[tool.setuptools.packages.find]
include = ["sqlgan_dual*"]
